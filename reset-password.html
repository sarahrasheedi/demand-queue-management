<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Profile & Password - Demand Queue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                purple: '#4f008c',
                'purple-hover': '#3d006d',
                dark: '#2d0050'
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style> * { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-lg max-w-md w-full space-y-5 border border-slate-200">
        <div class="text-center">
            <h2 class="text-xl font-bold text-slate-900">Set Up Your Account</h2>
            <p class="text-xs text-slate-500 mt-1">Please enter your full name and password to access the Admin Portal.</p>
        </div>
        
        <form id="setPasswordForm" onsubmit="handleSetPassword(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Full Name</label>
                <input type="text" id="fullName" placeholder="e.g. Sarah Al-Rasheedi" required class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-purple">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">New Password</label>
                <input type="password" id="newPassword" minlength="6" placeholder="At least 6 characters" required class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-purple">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Confirm Password</label>
                <input type="password" id="confirmPassword" minlength="6" placeholder="Repeat your password" required class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-purple">
            </div>

            <button type="submit" id="submitBtn" class="w-full py-2.5 bg-brand-purple hover:bg-brand-purple-hover text-white rounded-lg text-xs font-bold transition shadow-sm">
                Save & Continue
            </button>
        </form>
    </div>

<script>
    async function handleSetPassword(e) {
        e.preventDefault();
        
        const fullName = document.getElementById('fullName').value.trim();
        const password = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
            alert("Passwords do not match!");
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = 'Saving...';

        // 1. تحديث اسم المستخدم وكلمة المرور
        const { data, error } = await supabaseClient.auth.updateUser({
            password: password,
            data: { full_name: fullName }
        });

        if (error) {
            alert('Error updating profile: ' + error.message);
            btn.disabled = false;
            btn.innerText = 'Save & Continue';
        } else {
            // 2. إنهاء الجلسة التلقائية الناتجة عن توكن الدعوة
            await supabaseClient.auth.signOut();
            localStorage.clear();

            // 3. التوجيه إلى صفحة تسجيل الدخول
            alert('Account set up successfully! Please log in with your new password.');
            window.location.href = 'login.html';
        }
    }
</script>
</body>
</html>
