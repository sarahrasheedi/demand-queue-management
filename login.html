<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Portal Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <nav class="bg-slate-900 text-white px-6 py-4 border-b border-slate-800 flex justify-between items-center">
        <div class="flex items-center">
            <span class="font-bold text-lg tracking-wide">Demand Queue System</span>
        </div>
        <a href="index.html" class="text-xs font-semibold text-slate-300 hover:text-white transition">
            ← Back to Public View
        </a>
    </nav>

    <!-- Login Card Container -->
    <div class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-8 max-w-md w-full">
            
            <div class="text-center mb-6">
                <h2 class="text-xl font-bold text-slate-900">Developer Portal</h2>
            </div>

            <!-- Notification Alert -->
            <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-xs font-semibold border"></div>

            <!-- Login Form -->
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Corporate Email</label>
                    <input type="email" id="emailInput" required placeholder="developer@company.com" class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
                    <input type="password" id="passwordInput" required placeholder="••••••••" class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm py-2.5 rounded-lg transition duration-200 shadow-sm mt-2">
                    Sign In
                </button>
            </form>

        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        Developed by <strong>Wasmiya Al-Rashidi</strong> — Software Engineering Co-Op Project 2026
    </footer>

    <!-- Logic Script -->
    <script>
        // Authorized users dictionary
        const authorizedUsers = {
            "wasmiya@company.com": "admin123",
            "developer@company.com": "admin123"
        };

        const form = document.getElementById('loginForm');
        const alertBox = document.getElementById('alertBox');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('emailInput').value.toLowerCase().trim();
            const password = document.getElementById('passwordInput').value;

            // Check authorization
            if (!(email in authorizedUsers)) {
                showAlert("بريدك ليس مصرح للدخول لهذه الصفحة", "error");
            } else if (authorizedUsers[email] !== password) {
                showAlert("كلمة المرور غير صحيحة", "error");
            } else {
                showAlert("تم التحقق بنجاح، جاري الانتقال...", "success");
                setTimeout(() => {
                    window.location.href = "admin.html";
                }, 800);
            }
        });

        function showAlert(message, type) {
            alertBox.innerText = message;
            alertBox.classList.remove('hidden', 'bg-rose-50', 'text-rose-700', 'border-rose-200', 'bg-emerald-50', 'text-emerald-700', 'border-emerald-200');
            
            if (type === "error") {
                alertBox.classList.add('bg-rose-50', 'text-rose-700', 'border-rose-200');
            } else {
                alertBox.classList.add('bg-emerald-50', 'text-emerald-700', 'border-emerald-200');
            }
        }
    </script>

</body>
</html>
