<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Portal Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                purple: '#4f008c',
                'purple-hover': '#3d006d',
                'purple-light': '#f3e8ff',
                coral: '#f84362',
                'coral-hover': '#e03250',
                'coral-light': '#ffeef1',
                dark: '#2d0050'
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between">

    <nav class="bg-brand-dark text-white px-6 py-4 border-b border-brand-purple flex justify-between items-center">
        <div class="flex items-center">
            <span class="font-bold text-lg tracking-wide">Demand Queue System</span>
        </div>
        <a href="index.html" class="text-xs font-semibold text-purple-200 hover:text-white transition">
            ← Back to Public View
        </a>
    </nav>

    <div class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-8 max-w-md w-full">
            
            <div class="text-center mb-6">
                <h2 class="text-xl font-bold text-brand-dark">Developer Portal</h2>
            </div>

            <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-xs font-semibold border"></div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1"> Email</label>
                    <input type="email" id="emailInput" required placeholder="Enter your Email" class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-purple transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
                    <input type="password" id="passwordInput" required placeholder="••••••••" class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-purple transition">
                </div>

                <button type="submit" class="w-full bg-brand-purple hover:bg-brand-purple-hover text-white font-semibold text-sm py-2.5 rounded-lg transition duration-200 shadow-sm mt-2">
                    Sign In
                </button>
            </form>

        </div>
    </div>

    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        Developed by <strong>Sarah Alrasheedi</strong> 
    </footer>

<script>
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');

    const nextPage = new URLSearchParams(location.search).get('next') === 'index.html' ? 'index.html' : 'admin.html';
    function pageForRole(role) {
        return role === 'editor' ? nextPage : 'index.html';
    }

    getCurrentUserRole().then(role => {
        if (role) window.location.href = pageForRole(role);
    });
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('emailInput').value.toLowerCase().trim();
        const password = document.getElementById('passwordInput').value;

        try {
            const { data, error: authError } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (authError) {
                console.error("Auth Error:", authError);
                showAlert("كلمة المرور غير صحيحة أو الحساب غير مفعل", "error");
                return;
            }

            const { data: dev, error: devError } = await supabaseClient
                .from('authorized_developers')
                .select('email, role')
                .ilike('email', email)
                .maybeSingle();

            if (devError || !dev) {
                if (devError) console.error("Database Query Error:", devError);
                await supabaseClient.auth.signOut();
                showAlert(devError ? "حدث خطأ أثناء الاتصال بقاعدة البيانات" : "عذراً، هذا البريد غير مسجل في قائمة المطورين المصرح لهم", "error");
                return;
            }

            localStorage.setItem('userEmail', dev.email);
            localStorage.setItem('isLoggedIn', 'true');

            showAlert("تم التحقق بنجاح، جاري الانتقال...", "success");
            setTimeout(() => {
                window.location.href = pageForRole(dev.role);
            }, 800);

        } catch (err) {
            console.error("Unexpected Error:", err);
            showAlert("تعذر الاتصال بالخادم، تأكد من إعدادات Supabase", "error");
        }
    });

    function showAlert(message, type) {
        alertBox.innerText = message;
        alertBox.classList.remove('hidden', 'bg-brand-coral-light', 'text-brand-coral', 'border-brand-coral/30', 'bg-emerald-50', 'text-emerald-700', 'border-emerald-200');
        
        if (type === "error") {
            alertBox.classList.add('bg-brand-coral-light', 'text-brand-coral', 'border-brand-coral/30');
        } else {
            alertBox.classList.add('bg-emerald-50', 'text-emerald-700', 'border-emerald-200');
        }
    }
</script>

</body>
</html>
