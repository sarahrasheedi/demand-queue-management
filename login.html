<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Portal Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                purple: '#4f008c',
                'purple-hover': '#3d006d',
                'purple-light': '#f3e8ff',
                coral: '#f84362',
                'coral-hover': '#e03250',
                'coral-light': '#ffeef1',
                dark: '#2d0050'
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <nav class="bg-brand-dark text-white px-6 py-4 border-b border-brand-purple flex justify-between items-center">
        <div class="flex items-center">
            <span class="font-bold text-lg tracking-wide">Demand Queue System</span>
        </div>
        <a href="index.html" class="text-xs font-semibold text-purple-200 hover:text-white transition">
            ← Back to Public View
        </a>
    </nav>

    <!-- Login Card Container -->
    <div class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-8 max-w-md w-full">
            
            <div class="text-center mb-6">
                <h2 class="text-xl font-bold text-brand-dark">Developer Portal</h2>
            </div>

            <!-- Notification Alert -->
            <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-xs font-semibold border"></div>

            <!-- Login Form -->
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Corporate Email</label>
                    <input type="email" id="emailInput" required placeholder="developer@company.com" class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-purple transition">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
                    <input type="password" id="passwordInput" required placeholder="••••••••" class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-purple transition">
                </div>

                <button type="submit" class="w-full bg-brand-purple hover:bg-brand-purple-hover text-white font-semibold text-sm py-2.5 rounded-lg transition duration-200 shadow-sm mt-2">
                    Sign In
                </button>
            </form>

        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        Developed by <strong>Sarah Alrashee</strong> 
    </footer>

    <!-- Logic Script -->
    <script>
        // Authorized users dictionary
        const authorizedUsers = {
            "wasmiya@company.com": "admin123",
            "developer@company.com": "admin123"
        };

        const form = document.getElementById('loginForm');
        const alertBox = document.getElementById('alertBox');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('emailInput').value.toLowerCase().trim();
            const password = document.getElementById('passwordInput').value;

            // Check authorization
            if (!(email in authorizedUsers)) {
                showAlert("بريدك ليس مصرح للدخول لهذه الصفحة", "error");
            } else if (authorizedUsers[email] !== password) {
                showAlert("كلمة المرور غير صحيحة", "error");
            } else {
                showAlert("تم التحقق بنجاح، جاري الانتقال...", "success");
                setTimeout(() => {
                    window.location.href = "admin.html";
                }, 800);
            }
        });

        function showAlert(message, type) {
            alertBox.innerText = message;
            alertBox.classList.remove('hidden', 'bg-brand-coral-light', 'text-brand-coral', 'border-brand-coral/30', 'bg-emerald-50', 'text-emerald-700', 'border-emerald-200');
            
            if (type === "error") {
                alertBox.classList.add('bg-brand-coral-light', 'text-brand-coral', 'border-brand-coral/30');
            } else {
                alertBox.classList.add('bg-emerald-50', 'text-emerald-700', 'border-emerald-200');
            }
        }
    </script>

</body>
</html>
