<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demand Queue — Live Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                purple: '#4f008c',
                'purple-hover': '#3d006d',
                'purple-light': '#f3e8ff',
                coral: '#f84362',
                dark: '#2d0050'
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style> * { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col min-h-screen">

    <!-- Header / Navbar -->
    <nav class="bg-brand-dark text-white px-6 py-4 border-b border-brand-purple flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <span class="font-bold text-xl tracking-wide">Demand Queue</span>
            <span class="text-xs bg-brand-purple-light text-brand-purple px-2.5 py-1 rounded-full font-semibold">Live Board</span>
        </div>
        <a href="admin.html" class="text-xs font-semibold bg-brand-purple hover:bg-brand-purple-hover text-white px-4 py-2 rounded-lg transition shadow-sm">
            ⚙️ Admin Portal
        </a>
    </nav>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow">
        
        <div class="flex justify-between items-center mb-8">
            <div>
                <h2 class="text-2xl font-bold text-slate-900">Project Demands Queue</h2>
                <p class="text-xs text-slate-500 mt-1">Real-time status cards and estimated delivery timelines</p>
            </div>
            <button onclick="fetchPublicDemands()" class="text-xs font-semibold bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 px-3.5 py-2 rounded-lg transition shadow-sm flex items-center space-x-1">
                🔄 Refresh Board
            </button>
        </div>

        <!-- Demands Grid (مربعات / بطاقات) -->
        <div id="cardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full py-12 text-center text-slate-400">
                Loading demands...
            </div>
        </div>

    </div>

    <script>
        async function fetchPublicDemands() {
            const grid = document.getElementById('cardsGrid');
            
            // جلب البيانات الحية من Supabase
            const { data: demands, error } = await supabaseClient
                .from('demands')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                console.error("Error fetching demands:", error);
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-red-500 font-semibold">Error loading demands. Check browser console.</div>`;
                return;
            }

            if (!demands || demands.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full bg-white rounded-xl p-12 text-center border border-dashed border-slate-300 shadow-sm">
                        <p class="text-slate-500 font-semibold text-base">No demands in the queue yet.</p>
                        <p class="text-slate-400 text-xs mt-1">Add new demands from the Admin Portal to display them here.</p>
                    </div>`;
                return;
            }

            grid.innerHTML = '';
            demands.forEach(item => {
                // تلوين تصميم شارة الحالة
                let statusBadge = '';
                if (item.status === 'completed') {
                    statusBadge = `<span class="bg-emerald-100 text-emerald-700 font-bold text-xs px-3 py-1 rounded-full">Completed</span>`;
                } else if (item.status === 'in_progress') {
                    statusBadge = `<span class="bg-blue-100 text-blue-700 font-bold text-xs px-3 py-1 rounded-full">In Progress</span>`;
                } else {
                    statusBadge = `<span class="bg-amber-100 text-amber-700 font-bold text-xs px-3 py-1 rounded-full">Pending</span>`;
                }

                // كارت المربع لكل طلب
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl border border-slate-200 p-6 shadow-sm hover:shadow-md transition flex flex-col justify-between space-y-4";
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-3">
                            <span class="text-xs font-bold text-brand-purple bg-brand-purple-light px-2.5 py-1 rounded-md">
                                ${item.ref_id || 'REQ-' + (100 + item.id)}
                            </span>
                            ${statusBadge}
                        </div>
                        <h3 class="font-bold text-lg text-slate-900 leading-snug mb-1">${item.title}</h3>
                        <p class="text-xs font-medium text-slate-500">🏢 Department: <span class="text-slate-700 font-semibold">${item.department}</span></p>
                    </div>

                    <div class="pt-4 border-t border-slate-100 grid grid-cols-2 gap-2 text-xs">
                        <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-100">
                            <span class="block text-slate-400 text-[10px] font-semibold uppercase">Estimated Effort</span>
                            <span class="font-bold text-slate-800 text-sm">${item.estimated_days ? item.estimated_days + ' Days' : '-'}</span>
                        </div>
                        <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-100">
                            <span class="block text-slate-400 text-[10px] font-semibold uppercase">Due Date</span>
                            <span class="font-bold text-slate-800 text-sm">${item.due_date || '-'}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // تشغيل الجلب تلقائياً
        document.addEventListener('DOMContentLoaded', fetchPublicDemands);
    </script>
</body>
</html>
