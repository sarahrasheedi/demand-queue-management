<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demand Queue Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                purple: '#4f008c',
                'purple-hover': '#3d006d',
                'purple-light': '#f3e8ff',
                coral: '#f84362',
                dark: '#2d0050'
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style> 
        * { font-family: 'Cairo', sans-serif; } 
        /* تخصيص شريط التمرير الأفقي والرأسي */
        .custom-scroll::-webkit-scrollbar { height: 8px; width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; rounded: 8px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col h-screen overflow-hidden">

    <!-- Top Navigation Bar -->
    <nav class="bg-brand-dark text-white px-6 py-4 border-b border-brand-purple flex justify-between items-center shrink-0">
        <div class="flex items-center space-x-3">
            <span class="font-bold text-lg tracking-wide">Demand Queue Dashboard</span>
        </div>
        <div class="flex items-center space-x-3">
            <!-- Search Input الشامل -->
            <input 
                type="text" 
                id="publicSearchInput" 
                oninput="filterBoardDemands()" 
                placeholder="🔍 Search (Dev, Demand Name, REQ-ID, Process)..." 
                class="w-80 px-3.5 py-2 border border-brand-purple/40 rounded-lg text-xs outline-none focus:ring-2 focus:ring-brand-coral bg-white/10 text-white placeholder-slate-300"
            >
            
            <a href="admin.html" class="text-xs font-semibold bg-brand-coral hover:bg-brand-coral/90 text-white px-4 py-2 rounded-lg transition shadow-sm">
                Admin Portal
            </a>
        </div>
    </nav>

    <!-- Main Board Area -->
    <main class="flex-grow p-6 overflow-x-auto custom-scroll">
        <div id="kanbanBoard" class="flex space-x-4 min-w-max h-full pb-4">
            <!-- سيتم توليد أعمدة الحالات السبع ديناميكياً بواسطة JavaScript -->
        </div>
    </main>

<script>
    let allDemands = [];

    // الحالات السبع المعتمدة مع ألوان الهيدر والبادجات لكل حالة
    const STATUSES = [
        { name: "New", color: "bg-blue-600" },
        { name: "Requirement Gathering", color: "bg-amber-500" },
        { name: "Solution Design", color: "bg-purple-600" },
        { name: "Development", color: "bg-indigo-600" },
        { name: "Testing", color: "bg-pink-600" },
        { name: "Deployment", color: "bg-cyan-600" },
        { name: "Live", color: "bg-emerald-600" }
    ];

    // جلب البيانات مرتبة (الأحدث فوق والأقدم تحت)
    async function fetchDemands() {
        const { data: demands, error } = await supabaseClient
            .from('demands')
            .select('*')
            .order('id', { ascending: false });

        if (error) {
            console.error("Error fetching demands:", error);
            return;
        }

        allDemands = demands || [];
        renderKanbanBoard(allDemands);
    }

    // بناء اللوحة برمجياً
    function renderKanbanBoard(demands) {
        const boardContainer = document.getElementById('kanbanBoard');
        boardContainer.innerHTML = '';

        STATUSES.forEach(statusConfig => {
            const statusDemands = demands.filter(d => d.status === statusConfig.name);

            const columnEl = document.createElement('div');
            columnEl.className = "w-80 bg-slate-200/70 rounded-xl flex flex-col max-h-full border border-slate-300/60 shadow-sm shrink-0";

            columnEl.innerHTML = `
                <div class="p-3.5 flex justify-between items-center border-b border-slate-300/80 bg-slate-100 rounded-t-xl shrink-0">
                    <div class="flex items-center space-x-2">
                        <span class="w-3 h-3 rounded-full ${statusConfig.color}"></span>
                        <h3 class="font-bold text-xs text-slate-800 uppercase tracking-wide">${statusConfig.name}</h3>
                    </div>
                    <span class="text-xs font-bold bg-white text-slate-600 px-2.5 py-0.5 rounded-full border border-slate-200 shadow-xs">
                        ${statusDemands.length}
                    </span>
                </div>
                
                <div class="p-3 space-y-3 overflow-y-auto custom-scroll flex-grow">
                    ${statusDemands.length === 0 ? 
                        `<div class="text-center py-8 text-xs text-slate-400 font-medium">No tasks</div>` : 
                        statusDemands.map(item => createCardHtml(item)).join('')
                    }
                </div>
            `;

            boardContainer.appendChild(columnEl);
        });
    }

    // تصميم كرت الطلب مع دعم إظهار البروسيس والديفيلوبر والرقم ورقم الطلب
    function createCardHtml(item) {
        const formattedRefId = item.ref_id || 'REQ-' + String(item.id).padStart(3, '0');
        const processName = item.process_name || item.department || 'General Process';
        const developerName = item.assigned_to || 'Unassigned';

        return `
            <div class="bg-white p-4 rounded-lg shadow-xs border border-slate-200 hover:shadow-md transition flex flex-col space-y-3">
                <div class="flex justify-between items-start">
                    <span class="text-xs font-bold text-brand-purple bg-brand-purple-light px-2 py-0.5 rounded border border-brand-purple/10">
                        ${formattedRefId}
                    </span>
                    <span class="text-[10px] font-semibold text-slate-400">
                        Est: ${item.estimated_days || 1} d
                    </span>
                </div>

                <!-- اسم الطلب (Demand Name) -->
                <h4 class="font-bold text-sm text-slate-900 leading-snug break-words">
                    ${item.title}
                </h4>

                <div class="flex justify-between items-center text-xs pt-1 border-t border-slate-100 text-slate-500">
                    <!-- اسم البروسيس / القسم -->
                    <span class="font-medium bg-slate-100 px-2 py-0.5 rounded text-slate-600 truncate max-w-[150px]" title="${processName}">
                        ⚙️ ${processName}
                    </span>
                    <span class="text-[11px] font-semibold text-slate-500">
                        🗓 ${item.due_date || 'No Date'}
                    </span>
                </div>

                <!-- اسم الديفيلوبر / المسند إليه -->
                <div class="pt-1 flex justify-between items-center text-[11px]">
                    <span class="text-slate-400">Developer:</span>
                    <span class="font-semibold text-brand-purple bg-brand-purple-light/50 px-2 py-0.5 rounded">
                        👨‍💻 ${developerName}
                    </span>
                </div>
            </div>
        `;
    }

    // دالة الفلترة الشاملة
    function filterBoardDemands() {
        const query = document.getElementById('publicSearchInput').value.toLowerCase().trim();

        const filtered = allDemands.filter(item => {
            const formattedRefId = (item.ref_id || 'REQ-' + String(item.id).padStart(3, '0')).toLowerCase();
            const title = (item.title || '').toLowerCase(); // اسم الديماند
            const developer = (item.assigned_to || '').toLowerCase(); // اسم الديفيلوبر
            const process = (item.process_name || item.department || '').toLowerCase(); // اسم البروسيس

            // يبحث في أي من الحقول الأربعة
            return formattedRefId.includes(query) || 
                   title.includes(query) || 
                   developer.includes(query) || 
                   process.includes(query);
        });

        renderKanbanBoard(filtered);
    }

    document.addEventListener('DOMContentLoaded', fetchDemands);
</script>
</body>
</html>
