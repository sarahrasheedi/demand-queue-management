<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demand Queue Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                purple: '#4f008c',
                'purple-hover': '#3d006d',
                'purple-light': '#f3e8ff',
                coral: '#f84362',
                'coral-hover': '#e03250',
                dark: '#2d0050'
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style> 
      * { font-family: 'Cairo', sans-serif; } 
      .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col min-h-screen">

    <!-- Header -->
    <header class="bg-brand-dark text-white border-b border-brand-purple">
        <div class="max-w-full mx-auto px-6 py-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">Demand Queue Lifecycle</h1>

            </div>
            <div>
                <a href="login.html" class="text-xs font-semibold bg-brand-purple hover:bg-brand-purple-hover text-white px-4 py-2.5 rounded-lg border border-purple-400/30 transition shadow-sm">
                    Admin Portal Login
                </a>
            </div>
        </div>
    </header>

    <!-- Content Area -->
    <main class="max-w-full mx-auto px-6 py-8 w-full flex-grow flex flex-col">
        
        <!-- Controls Bar -->
        <div class="flex flex-col md:flex-row justify-between items-stretch md:items-center gap-4 mb-6 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
            
            <div class="flex overflow-x-auto gap-1.5 pb-2 md:pb-0 custom-scrollbar" id="statusTabs">
                <button onclick="filterByStatus('ALL', event)" class="status-tab active-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-brand-purple text-white">All Requests</button>
                <button onclick="filterByStatus('New', event)" class="status-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-slate-100 text-slate-600 hover:bg-slate-200">New</button>
                <button onclick="filterByStatus('Requirement Gathering', event)" class="status-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-slate-100 text-slate-600 hover:bg-slate-200">Requirement Gathering</button>
                <button onclick="filterByStatus('Solution Design', event)" class="status-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-slate-100 text-slate-600 hover:bg-slate-200">Solution Design</button>
                <button onclick="filterByStatus('Development', event)" class="status-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-slate-100 text-slate-600 hover:bg-slate-200">Development</button>
                <button onclick="filterByStatus('Testing', event)" class="status-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-slate-100 text-slate-600 hover:bg-slate-200">Testing</button>
                <button onclick="filterByStatus('Deployment', event)" class="status-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-slate-100 text-slate-600 hover:bg-slate-200">Deployment</button>
                <button onclick="filterByStatus('Live', event)" class="status-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-slate-100 text-slate-600 hover:bg-slate-200">Live</button>
            </div>

            <div class="relative w-full md:w-72">
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="🔍 Search demands..." class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-xs outline-none focus:ring-2 focus:ring-brand-purple shadow-sm">
            </div>
        </div>

        <div id="demandsContainer" class="flex-grow">
            <div class="text-center py-12 text-slate-400">Loading demand queue...</div>
        </div>
    </main>

<script>
    let allDemands = [];
    let currentFilter = 'ALL';

    const STATUSES = [
        "New",
        "Requirement Gathering",
        "Solution Design",
        "Development",
        "Testing",
        "Deployment",
        "Live"
    ];

    const STATUS_STYLES = {
        'New': { bg: 'bg-blue-50', text: 'text-blue-700', border: 'border-blue-200', badge: 'bg-blue-100 text-blue-800' },
        'Requirement Gathering': { bg: 'bg-amber-50', text: 'text-amber-700', border: 'border-amber-200', badge: 'bg-amber-100 text-amber-800' },
        'Solution Design': { bg: 'bg-purple-50', text: 'text-purple-700', border: 'border-purple-200', badge: 'bg-purple-100 text-purple-800' },
        'Development': { bg: 'bg-indigo-50', text: 'text-indigo-700', border: 'border-indigo-200', badge: 'bg-indigo-100 text-indigo-800' },
        'Testing': { bg: 'bg-orange-50', text: 'text-orange-700', border: 'border-orange-200', badge: 'bg-orange-100 text-orange-800' },
        'Deployment': { bg: 'bg-teal-50', text: 'text-teal-700', border: 'border-teal-200', badge: 'bg-teal-100 text-teal-800' },
        'Live': { bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-200', badge: 'bg-emerald-100 text-emerald-800' }
    };

    async function fetchPublicDemands() {
        const { data: demands, error } = await supabaseClient.from('demands').select('*').order('id', { ascending: false });

        if (error) {
            console.error("Error loading demands:", error);
            document.getElementById('demandsContainer').innerHTML = `<div class="text-center py-12 text-red-500">Failed to load demands. Please refresh.</div>`;
            return;
        }

        allDemands = demands || [];
        applyFilters();
    }

    function createCardElement(item) {
        const formattedRefId = item.ref_id || 'REQ-' + String(item.id).padStart(3, '0');
        const style = STATUS_STYLES[item.status] || { bg: 'bg-slate-50', text: 'text-slate-700', border: 'border-slate-200', badge: 'bg-slate-100 text-slate-800' };
        const daysCount = item.estimated_days || 1;
        const daysLabel = daysCount === 1 ? 'Day' : 'Days';

        return `
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition p-4 flex flex-col justify-between space-y-3">
                <div>
                    <div class="flex justify-between items-start mb-2 gap-2">
                        <span class="text-xs font-bold text-brand-purple tracking-wide">${formattedRefId}</span>
                        <span class="px-2 py-0.5 rounded-md text-[10px] font-bold ${style.badge}">
                            ${item.status}
                        </span>
                    </div>

                    <h3 class="font-bold text-slate-900 text-sm mb-1 leading-snug">${item.title}</h3>
                    <p class="text-xs text-slate-500 font-medium mb-2">${item.department || 'General'}</p>
                </div>

                <div class="pt-2 border-t border-slate-100 flex flex-col gap-1.5">
                    
                    <div class="inline-flex items-center gap-1.5 px-2 py-1 bg-slate-50 border border-slate-200 rounded-md text-[11px] font-semibold text-slate-700 w-fit">
                        <svg class="w-3.5 h-3.5 text-brand-purple" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <span>Estimated Effort: <strong class="text-brand-purple font-bold">${daysCount} ${daysLabel}</strong></span>
                    </div>

                    <div class="flex justify-between items-center text-[10px] text-slate-500 mt-0.5">
                        <span>Developer:</span>
                        <span class="font-bold text-slate-800">${item.assigned_developer || 'Unassigned'}</span>
                    </div>

                    <div class="flex justify-between items-center text-[10px] text-slate-500">
                        <span>Due Date:</span>
                        <span class="font-bold text-slate-700">${item.due_date || 'TBD'}</span>
                    </div>
                </div>
            </div>
        `;
    }

    function renderKanbanBoard(filteredDemands) {
        const container = document.getElementById('demandsContainer');
        let columnsHtml = `<div class="flex gap-4 overflow-x-auto pb-6 items-start custom-scrollbar">`;

        STATUSES.forEach(status => {
            const itemsInStatus = filteredDemands.filter(d => d.status === status);
            const style = STATUS_STYLES[status];

            columnsHtml += `
                <div class="w-80 flex-shrink-0 bg-slate-200/60 rounded-xl p-3 border border-slate-300/60 flex flex-col max-h-[calc(100vh-220px)]">
                    <div class="flex items-center justify-between pb-3 px-1">
                        <div class="flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full ${style.badge.split(' ')[0]} border ${style.border}"></span>
                            <h3 class="font-bold text-xs text-slate-800 uppercase tracking-wider">${status}</h3>
                        </div>
                        <span class="text-xs font-bold text-slate-500 bg-white px-2 py-0.5 rounded-full border border-slate-200">${itemsInStatus.length}</span>
                    </div>

                    <div class="space-y-3 overflow-y-auto pr-1 flex-grow custom-scrollbar">
                        ${itemsInStatus.length > 0 
                            ? itemsInStatus.map(item => createCardElement(item)).join('')
                            : `<div class="bg-white/50 border border-dashed border-slate-300 rounded-lg p-6 text-center text-xs text-slate-400">No requests in this status</div>`
                        }
                    </div>
                </div>
            `;
        });

        columnsHtml += `</div>`;
        container.innerHTML = columnsHtml;
    }

    function renderSingleGrid(filteredDemands) {
        const container = document.getElementById('demandsContainer');
        if (!filteredDemands || filteredDemands.length === 0) {
            container.innerHTML = `<div class="text-center py-12 text-slate-400 font-medium">No demands found in this status.</div>`;
            return;
        }

        container.innerHTML = `
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                ${filteredDemands.map(item => createCardElement(item)).join('')}
            </div>
        `;
    }

    function filterByStatus(status, evt) {
        currentFilter = status;
        document.querySelectorAll('.status-tab').forEach(btn => {
            btn.className = "status-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-slate-100 text-slate-600 hover:bg-slate-200";
        });
        if (evt && evt.target) evt.target.className = "status-tab active-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-brand-purple text-white";
        applyFilters();
    }

    function handleSearch() { applyFilters(); }

    function applyFilters() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        let filtered = allDemands;

        if (query !== '') {
            filtered = filtered.filter(item => {
                const ref = (item.ref_id || 'REQ-' + String(item.id).padStart(3, '0')).toLowerCase();
                const title = (item.title || '').toLowerCase();
                const dept = (item.department || '').toLowerCase();
                const dev = (item.assigned_developer || '').toLowerCase();
                return ref.includes(query) || title.includes(query) || dept.includes(query) || dev.includes(query);
            });
        }

        if (currentFilter === 'ALL') renderKanbanBoard(filtered);
        else renderSingleGrid(filtered.filter(item => item.status === currentFilter));
    }

    document.addEventListener('DOMContentLoaded', fetchPublicDemands);
</script>
</body>
</html>
