<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demand Queue Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                purple: '#4f008c',
                'purple-hover': '#3d006d',
                'purple-light': '#f3e8ff',
                coral: '#f84362',
                'coral-hover': '#e03250',
                dark: '#2d0050'
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> 
      * { font-family: 'Inter', sans-serif; } 
      .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col min-h-screen">

    <!-- Header -->
    <header class="bg-brand-dark text-white border-b border-brand-purple">
        <div class="max-w-full mx-auto px-6 py-5 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">Demand Queue Lifecycle</h1>
            </div>
            <div id="authHeaderArea">
                <a href="login.html" id="loginBtn" class="text-xs font-semibold bg-brand-purple hover:bg-brand-purple-hover text-white px-4 py-2.5 rounded-lg border border-purple-400/30 transition shadow-sm">
                    Admin Portal Login
                </a>
            </div>
        </div>
    </header>

    <!-- Content Area -->
    <main class="max-w-full mx-auto px-6 py-8 w-full flex-grow flex flex-col">
        
        <!-- Top Navigation View Selector -->
        <div class="flex items-center gap-3 mb-4">
            <button onclick="switchMainView('STATUS')" id="btnViewStatus" class="view-tab px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 bg-brand-purple text-white shadow-sm">
                Status
            </button>
            <button onclick="switchMainView('DEVELOPER')" id="btnViewDeveloper" class="view-tab px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 bg-white text-slate-600 hover:bg-slate-200 border border-slate-200">
                Developer
            </button>
            <button onclick="switchMainView('APPLICATION')" id="btnViewApplication" class="view-tab px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 bg-white text-slate-600 hover:bg-slate-200 border border-slate-200">
                Application
            </button>
        </div>

        <!-- Controls Bar -->
        <div class="flex flex-col md:flex-row justify-between items-stretch md:items-center gap-4 mb-6 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
            
            <div class="flex overflow-x-auto gap-1.5 pb-2 md:pb-0 custom-scrollbar" id="statusTabs">
                <button onclick="filterByStatus('ALL', event)" class="status-tab active-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-brand-purple text-white">All Requests</button>
                <button onclick="filterByStatus('New', event)" class="status-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-slate-100 text-slate-600 hover:bg-slate-200">New</button>
                <button onclick="filterByStatus('Requirement Gathering', event)" class="status-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-slate-100 text-slate-600 hover:bg-slate-200">Requirement Gathering</button>
                <button onclick="filterByStatus('Solution Design', event)" class="status-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-slate-100 text-slate-600 hover:bg-slate-200">Solution Design</button>
                <button onclick="filterByStatus('Development', event)" class="status-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-slate-100 text-slate-600 hover:bg-slate-200">Development</button>
                <button onclick="filterByStatus('Testing', event)" class="status-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-slate-100 text-slate-600 hover:bg-slate-200">Testing</button>
                <button onclick="filterByStatus('Deployment', event)" class="status-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-slate-100 text-slate-600 hover:bg-slate-200">Deployment</button>
                <button onclick="filterByStatus('Live', event)" class="status-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-slate-100 text-slate-600 hover:bg-slate-200">Live</button>
            </div>

            <div class="relative w-full md:w-72">
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search demands..." class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-xs outline-none focus:ring-2 focus:ring-brand-purple shadow-sm">
            </div>
        </div>

        <div id="demandsContainer" class="flex-grow">
            <div class="text-center py-12 text-slate-400">Loading demand queue...</div>
        </div>
    </main>

    <!-- Admin Edit Modal Box -->
    <div id="editModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-xl overflow-hidden border border-slate-200 transform transition-all">
            <div class="bg-brand-dark px-6 py-4 flex justify-between items-center text-white">
                <h3 class="font-bold text-base flex items-center gap-2">
                    <span>Edit Demand Details</span>
                    <span id="modalRefId" class="text-xs font-normal text-purple-200 bg-brand-purple px-2 py-0.5 rounded-md"></span>
                </h3>
                <button onclick="closeEditModal()" class="text-slate-300 hover:text-white font-bold text-lg">&times;</button>
            </div>
            
            <form id="editForm" onsubmit="handleSaveEdit(event)" class="p-6 space-y-4 max-h-[80vh] overflow-y-auto custom-scrollbar">
                <input type="hidden" id="editDemandId">

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Title</label>
                    <input type="text" id="editTitle" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-brand-purple outline-none">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Requester</label>
                        <input type="text" id="editRequester" placeholder="e.g. HR Dept / Sarah" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-brand-purple outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Application / Department</label>
                        <input type="text" id="editDepartment" placeholder="e.g. Rahabah" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-brand-purple outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Status</label>
                        <select id="editStatus" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-brand-purple outline-none">
                            <option value="New">New</option>
                            <option value="Requirement Gathering">Requirement Gathering</option>
                            <option value="Solution Design">Solution Design</option>
                            <option value="Development">Development</option>
                            <option value="Testing">Testing</option>
                            <option value="Deployment">Deployment</option>
                            <option value="Live">Live</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Priority</label>
                        <select id="editPriority" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-brand-purple outline-none">
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                            <option value="Critical">Critical</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Assigned Developer</label>
                        <input type="text" id="editDeveloper" placeholder="e.g. Tahani / Moaid" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-brand-purple outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Estimated Effort (Days)</label>
                        <input type="number" id="editEffort" min="1" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-brand-purple outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Creation Date</label>
                        <input type="date" id="editCreationDate" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-brand-purple outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Due Date</label>
                        <input type="date" id="editDueDate" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-brand-purple outline-none">
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-200 flex justify-end gap-3">
                    <button type="button" onclick="closeEditModal()" class="px-4 py-2 rounded-lg text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 transition">Cancel</button>
                    <button type="submit" id="saveBtn" class="px-5 py-2 rounded-lg text-xs font-bold bg-brand-purple text-white hover:bg-brand-purple-hover transition shadow-sm">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

<script>
    let allDemands = [];
    let currentFilter = 'ALL';
    let currentMainView = 'STATUS'; // STATUS, DEVELOPER, APPLICATION
    let isAdminLoggedIn = false;

    const STATUSES = [
        "New",
        "Requirement Gathering",
        "Solution Design",
        "Development",
        "Testing",
        "Deployment",
        "Live"
    ];

    const STATUS_STYLES = {
        'New': { bg: 'bg-blue-50', text: 'text-blue-700', border: 'border-blue-200', badge: 'bg-blue-100 text-blue-800' },
        'Requirement Gathering': { bg: 'bg-amber-50', text: 'text-amber-700', border: 'border-amber-200', badge: 'bg-amber-100 text-amber-800' },
        'Solution Design': { bg: 'bg-purple-50', text: 'text-purple-700', border: 'border-purple-200', badge: 'bg-purple-100 text-purple-800' },
        'Development': { bg: 'bg-indigo-50', text: 'text-indigo-700', border: 'border-indigo-200', badge: 'bg-indigo-100 text-indigo-800' },
        'Testing': { bg: 'bg-orange-50', text: 'text-orange-700', border: 'border-orange-200', badge: 'bg-orange-100 text-orange-800' },
        'Deployment': { bg: 'bg-teal-50', text: 'text-teal-700', border: 'border-teal-200', badge: 'bg-teal-100 text-teal-800' },
        'Live': { bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-200', badge: 'bg-emerald-100 text-emerald-800' }
    };

    const PRIORITY_STYLES = {
        'Low': 'bg-slate-100 text-slate-700 border-slate-200',
        'Medium': 'bg-blue-50 text-blue-700 border-blue-200',
        'High': 'bg-orange-50 text-orange-700 border-orange-200',
        'Critical': 'bg-red-50 text-red-700 border-red-200'
    };

    async function checkAdminAuth() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
            isAdminLoggedIn = true;
            document.getElementById('authHeaderArea').innerHTML = `
                <div class="flex items-center gap-3">
                    <span class="text-xs text-purple-200 font-medium">Logged in as Admin</span>
                    <a href="admin.html" class="text-xs font-semibold bg-brand-purple hover:bg-brand-purple-hover text-white px-3 py-1.5 rounded-lg border border-purple-400/30 transition">
                        Admin Dashboard
                    </a>
                </div>
            `;
        }
    }

    async function fetchPublicDemands() {
        const { data: demands, error } = await supabaseClient.from('demands').select('*').order('id', { ascending: false });

        if (error) {
            console.error("Error loading demands:", error);
            document.getElementById('demandsContainer').innerHTML = `<div class="text-center py-12 text-red-500">Failed to load demands. Please refresh.</div>`;
            return;
        }

        allDemands = demands || [];
        applyFilters();
    }

    function createCardElement(item) {
        const formattedRefId = item.ref_id || 'REQ-' + String(item.id).padStart(3, '0');
        const style = STATUS_STYLES[item.status] || { bg: 'bg-slate-50', text: 'text-slate-700', border: 'border-slate-200', badge: 'bg-slate-100 text-slate-800' };
        const priorityStyle = PRIORITY_STYLES[item.priority || 'Medium'] || PRIORITY_STYLES['Medium'];
        const daysCount = item.estimated_days || 1;
        const daysLabel = daysCount === 1 ? 'Day' : 'Days';

        const adminEditBtn = isAdminLoggedIn ? `
            <button onclick="openEditModal(${item.id})" class="text-xs text-slate-400 hover:text-brand-purple p-1 rounded transition font-bold" title="Edit">
                Edit
            </button>
        ` : '';

        return `
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition p-4 flex flex-col justify-between space-y-3 relative group">
                <div>
                    <div class="flex justify-between items-start mb-2 gap-2">
                        <div class="flex items-center gap-1.5">
                            <span class="text-xs font-bold text-brand-purple tracking-wide">${formattedRefId}</span>
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold border ${priorityStyle}">
                                ${item.priority || 'Medium'}
                            </span>
                        </div>
                        <div class="flex items-center gap-1">
                            <span class="px-2 py-0.5 rounded-md text-[10px] font-bold ${style.badge}">
                                ${item.status}
                            </span>
                            ${adminEditBtn}
                        </div>
                    </div>

                    <h3 class="font-bold text-slate-900 text-sm mb-1 leading-snug">${item.title}</h3>
                    <div class="flex justify-between items-center text-xs text-slate-500 font-medium mb-2">
                        <span>App: <strong class="text-slate-700">${item.department || 'General'}</strong></span>
                        <span>Requester: <strong class="text-slate-700">${item.requester || 'N/A'}</strong></span>
                    </div>
                </div>

                <div class="pt-2 border-t border-slate-100 flex flex-col gap-1.5">
                    <div class="inline-flex items-center gap-1.5 px-2 py-1 bg-slate-50 border border-slate-200 rounded-md text-[11px] font-semibold text-slate-700 w-fit">
                        <span>Effort: <strong class="text-brand-purple font-bold">${daysCount} ${daysLabel}</strong></span>
                    </div>

                    <div class="flex justify-between items-center text-[10px] text-slate-500 mt-0.5">
                        <span>Developer:</span>
                        <span class="font-bold text-slate-800">${item.assigned_developer || 'Unassigned'}</span>
                    </div>

                    <div class="flex justify-between items-center text-[10px] text-slate-500">
                        <span>Created: <strong class="text-slate-700">${item.created_at ? new Date(item.created_at).toISOString().split('T')[0] : 'N/A'}</strong></span>
                        <span>Due: <strong class="text-slate-700">${item.due_date || 'TBD'}</strong></span>
                    </div>
                </div>
            </div>
        `;
    }

    // Modal Operations for Admin Quick Edit
    function openEditModal(id) {
        const item = allDemands.find(d => d.id === id);
        if (!item) return;

        document.getElementById('editDemandId').value = item.id;
        document.getElementById('modalRefId').textContent = item.ref_id || 'REQ-' + String(item.id).padStart(3, '0');
        document.getElementById('editTitle').value = item.title || '';
        document.getElementById('editRequester').value = item.requester || '';
        document.getElementById('editDepartment').value = item.department || '';
        document.getElementById('editStatus').value = item.status || 'New';
        document.getElementById('editPriority').value = item.priority || 'Medium';
        document.getElementById('editDeveloper').value = item.assigned_developer || '';
        document.getElementById('editEffort').value = item.estimated_days || 1;
        document.getElementById('editCreationDate').value = item.created_at ? new Date(item.created_at).toISOString().split('T')[0] : '';
        document.getElementById('editDueDate').value = item.due_date || '';

        document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() {
        document.getElementById('editModal').classList.add('hidden');
    }

    async function handleSaveEdit(e) {
        e.preventDefault();
        const id = document.getElementById('editDemandId').value;
        const btn = document.getElementById('saveBtn');
        btn.disabled = true;
        btn.textContent = 'Saving...';

        const updateData = {
            title: document.getElementById('editTitle').value,
            requester: document.getElementById('editRequester').value,
            department: document.getElementById('editDepartment').value,
            status: document.getElementById('editStatus').value,
            priority: document.getElementById('editPriority').value,
            assigned_developer: document.getElementById('editDeveloper').value,
            estimated_days: parseInt(document.getElementById('editEffort').value) || 1,
            created_at: document.getElementById('editCreationDate').value ? new Date(document.getElementById('editCreationDate').value).toISOString() : new Date().toISOString(),
            due_date: document.getElementById('editDueDate').value || null
        };

        const { error } = await supabaseClient.from('demands').update(updateData).eq('id', id);

        btn.disabled = false;
        btn.textContent = 'Save Changes';

        if (error) {
            alert('Failed to update demand: ' + error.message);
            return;
        }

        closeEditModal();
        await fetchPublicDemands();
    }

    // View Renders (Status Vertical Columns / Kanban)
    function renderKanbanBoard(filteredDemands) {
        const container = document.getElementById('demandsContainer');
        let columnsHtml = `<div class="flex gap-4 overflow-x-auto pb-6 items-start custom-scrollbar">`;

        STATUSES.forEach(status => {
            const itemsInStatus = filteredDemands.filter(d => d.status === status);
            const style = STATUS_STYLES[status];

            columnsHtml += `
                <div class="w-80 flex-shrink-0 bg-slate-200/60 rounded-xl p-3 border border-slate-300/60 flex flex-col max-h-[calc(100vh-220px)]">
                    <div class="flex items-center justify-between pb-3 px-1">
                        <div class="flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full ${style.badge.split(' ')[0]} border ${style.border}"></span>
                            <h3 class="font-bold text-xs text-slate-800 uppercase tracking-wider">${status}</h3>
                        </div>
                        <span class="text-xs font-bold text-slate-500 bg-white px-2 py-0.5 rounded-full border border-slate-200">${itemsInStatus.length}</span>
                    </div>

                    <div class="space-y-3 overflow-y-auto pr-1 flex-grow custom-scrollbar">
                        ${itemsInStatus.length > 0 
                            ? itemsInStatus.map(item => createCardElement(item)).join('')
                            : `<div class="bg-white/50 border border-dashed border-slate-300 rounded-lg p-6 text-center text-xs text-slate-400">No requests in this status</div>`
                        }
                    </div>
                </div>
            `;
        });

        columnsHtml += `</div>`;
        container.innerHTML = columnsHtml;
    }

    // Developer View (Horizontal Sections)
    function renderDeveloperGroupedBoard(filteredDemands) {
        const container = document.getElementById('demandsContainer');
        
        let developersList = ['Tahani', 'Moaid'];
        const extraDevs = Array.from(new Set(allDemands.map(d => d.assigned_developer).filter(Boolean)));
        
        extraDevs.forEach(dev => {
            if (!developersList.some(d => d.toLowerCase() === dev.toLowerCase()) && dev !== 'Unassigned') {
                developersList.push(dev);
            }
        });

        let sectionsHtml = `<div class="flex flex-col gap-6 w-full">`;

        developersList.forEach(dev => {
            const itemsForDev = filteredDemands.filter(d => {
                const assigned = (d.assigned_developer || '').trim();
                return assigned.toLowerCase() === dev.toLowerCase();
            });

            sectionsHtml += `
                <div class="bg-slate-200/60 rounded-xl p-4 border border-slate-300/60 flex flex-col gap-3">
                    <div class="flex items-center justify-between border-b border-slate-300/80 pb-2">
                        <h3 class="font-bold text-sm text-slate-800 tracking-wider">${dev}</h3>
                        <span class="text-xs font-bold text-slate-600 bg-white px-2.5 py-0.5 rounded-full border border-slate-200">${itemsForDev.length} Demands</span>
                    </div>

                    ${itemsForDev.length > 0 
                        ? `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${itemsForDev.map(item => createCardElement(item)).join('')}
                           </div>`
                        : `<div class="bg-white/50 border border-dashed border-slate-300 rounded-lg p-4 text-center text-xs text-slate-400">No demands assigned to ${dev}</div>`
                    }
                </div>
            `;
        });

        sectionsHtml += `</div>`;
        container.innerHTML = sectionsHtml;
    }

    // Application View (Horizontal Sections)
    function renderApplicationGroupedBoard(filteredDemands) {
        const container = document.getElementById('demandsContainer');
        
        let appsList = ['Rahabah'];
        const extraApps = Array.from(new Set(allDemands.map(d => d.department).filter(Boolean)));

        extraApps.forEach(app => {
            if (!appsList.some(a => a.toLowerCase() === app.toLowerCase())) {
                appsList.push(app);
            }
        });

        let sectionsHtml = `<div class="flex flex-col gap-6 w-full">`;

        appsList.forEach(app => {
            const itemsForApp = filteredDemands.filter(d => {
                const dept = (d.department || 'General').trim();
                return dept.toLowerCase() === app.toLowerCase();
            });

            sectionsHtml += `
                <div class="bg-slate-200/60 rounded-xl p-4 border border-slate-300/60 flex flex-col gap-3">
                    <div class="flex items-center justify-between border-b border-slate-300/80 pb-2">
                        <h3 class="font-bold text-sm text-slate-800 tracking-wider">${app}</h3>
                        <span class="text-xs font-bold text-slate-600 bg-white px-2.5 py-0.5 rounded-full border border-slate-200">${itemsForApp.length} Demands</span>
                    </div>

                    ${itemsForApp.length > 0 
                        ? `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${itemsForApp.map(item => createCardElement(item)).join('')}
                           </div>`
                        : `<div class="bg-white/50 border border-dashed border-slate-300 rounded-lg p-4 text-center text-xs text-slate-400">No demands for ${app}</div>`
                    }
                </div>
            `;
        });

        sectionsHtml += `</div>`;
        container.innerHTML = sectionsHtml;
    }

    function renderSingleGrid(filteredDemands) {
        const container = document.getElementById('demandsContainer');
        if (!filteredDemands || filteredDemands.length === 0) {
            container.innerHTML = `<div class="text-center py-12 text-slate-400 font-medium">No demands found.</div>`;
            return;
        }

        container.innerHTML = `
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                ${filteredDemands.map(item => createCardElement(item)).join('')}
            </div>
        `;
    }

    function switchMainView(viewName) {
        currentMainView = viewName;

        document.getElementById('btnViewStatus').className = "view-tab px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 bg-white text-slate-600 hover:bg-slate-200 border border-slate-200";
        document.getElementById('btnViewDeveloper').className = "view-tab px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 bg-white text-slate-600 hover:bg-slate-200 border border-slate-200";
        document.getElementById('btnViewApplication').className = "view-tab px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 bg-white text-slate-600 hover:bg-slate-200 border border-slate-200";

        if (viewName === 'STATUS') {
            document.getElementById('btnViewStatus').className = "view-tab px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 bg-brand-purple text-white shadow-sm";
            document.getElementById('statusTabs').classList.remove('hidden');
        } else if (viewName === 'DEVELOPER') {
            document.getElementById('btnViewDeveloper').className = "view-tab px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 bg-brand-purple text-white shadow-sm";
            document.getElementById('statusTabs').classList.add('hidden');
        } else if (viewName === 'APPLICATION') {
            document.getElementById('btnViewApplication').className = "view-tab px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 bg-brand-purple text-white shadow-sm";
            document.getElementById('statusTabs').classList.add('hidden');
        }

        applyFilters();
    }

    function filterByStatus(status, evt) {
        currentFilter = status;
        document.querySelectorAll('.status-tab').forEach(btn => {
            btn.className = "status-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-slate-100 text-slate-600 hover:bg-slate-200";
        });
        if (evt && evt.target) evt.target.className = "status-tab active-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-brand-purple text-white";
        applyFilters();
    }

    function handleSearch() { applyFilters(); }

    function applyFilters() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        let filtered = allDemands;

        if (query !== '') {
            filtered = filtered.filter(item => {
                const ref = (item.ref_id || 'REQ-' + String(item.id).padStart(3, '0')).toLowerCase();
                const title = (item.title || '').toLowerCase();
                const dept = (item.department || '').toLowerCase();
                const dev = (item.assigned_developer || '').toLowerCase();
                const req = (item.requester || '').toLowerCase();
                return ref.includes(query) || title.includes(query) || dept.includes(query) || dev.includes(query) || req.includes(query);
            });
        }

        if (currentMainView === 'STATUS') {
            if (currentFilter === 'ALL') renderKanbanBoard(filtered);
            else renderSingleGrid(filtered.filter(item => item.status === currentFilter));
        } else if (currentMainView === 'DEVELOPER') {
            renderDeveloperGroupedBoard(filtered);
        } else if (currentMainView === 'APPLICATION') {
            renderApplicationGroupedBoard(filtered);
        }
    }

    document.addEventListener('DOMContentLoaded', async () => {
        await checkAdminAuth();
        await fetchPublicDemands();
    });
</script>
</body>
</html>
