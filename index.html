<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demand Queue — Live Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                purple: '#4f008c',
                'purple-hover': '#3d006d',
                'purple-light': '#f3e8ff',
                coral: '#f84362',
                dark: '#2d0050'
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style> * { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col min-h-screen">

    <!-- Header / Navbar -->
    <nav class="bg-brand-dark text-white px-6 py-4 border-b border-brand-purple flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <span class="font-bold text-xl tracking-wide">Demand Queue</span>
            <span class="text-xs bg-brand-purple-light text-brand-purple px-2.5 py-1 rounded-full font-semibold">Live Board</span>
        </div>
        <a href="admin.html" class="text-xs font-semibold bg-brand-purple hover:bg-brand-purple-hover text-white px-4 py-2 rounded-lg transition shadow-sm">
            ⚙️ Admin Portal
        </a>
    </nav>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow">
        
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
            <div>
                <h2 class="text-2xl font-bold text-slate-900">Project Demands Queue</h2>
                <p class="text-xs text-slate-500 mt-1">Real-time status cards and estimated delivery timelines</p>
            </div>
            
            <div class="flex items-center space-x-3 w-full md:w-auto">
                <input type="text" id="publicSearchInput" oninput="filterPublicDemands()" placeholder="🔍 Search title, dept, or ID..." class="w-full md:w-64 px-3.5 py-2 bg-white border border-slate-300 rounded-lg text-xs outline-none focus:ring-2 focus:ring-brand-purple shadow-sm">
                <button onclick="loadPublicDemands()" class="text-xs font-semibold bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 px-3.5 py-2 rounded-lg transition shadow-sm flex items-center shrink-0">
                    🔄 Refresh Board
                </button>
            </div>
        </div>

        <!-- Demands Grid -->
        <div id="cardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full py-12 text-center text-slate-400">
                Loading demands...
            </div>
        </div>

    </div>

<script>
    let publicDemands = [];

    // 1. جلب البيانات من Supabase
    async function loadPublicDemands() {
        const grid = document.getElementById('cardsGrid');
        if (!grid) return;

        grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400">Loading demands...</div>`;

        const { data: demands, error } = await supabaseClient
            .from('demands')
            .select('*')
            .order('id', { ascending: false });

        if (error) {
            console.error("Error fetching demands for dashboard:", error);
            grid.innerHTML = `<div class="col-span-full text-center py-8 text-rose-500">Failed to load demands. Check console.</div>`;
            return;
        }

        publicDemands = demands || [];
        renderPublicBoard(publicDemands);
    }

    // 2. عرض البطاقات في الصفحة
    function renderPublicBoard(demands) {
        const grid = document.getElementById('cardsGrid');
        if (!grid) return;

        if (!demands || demands.length === 0) {
            grid.innerHTML = `<div class="col-span-full text-center py-8 text-slate-400">No demands available.</div>`;
            return;
        }

        grid.innerHTML = '';
        demands.forEach(item => {
            const card = document.createElement('div');
            card.className = "bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition space-y-3";
            
            const refCode = item.ref_id || ('REQ-' + String(item.id).padStart(3, '0'));
            
            card.innerHTML = `
                <div class="flex justify-between items-center">
                    <span class="text-xs font-bold text-brand-purple">${refCode}</span>
                    <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${getStatusStyle(item.status)}">
                        ${formatStatus(item.status)}
                    </span>
                </div>
                <h3 class="font-bold text-slate-900 text-sm leading-snug">${item.title || 'Untitled Demand'}</h3>
                <div class="flex justify-between items-center text-xs text-slate-500 pt-3 border-t border-slate-100">
                    <span class="font-medium">${item.department || 'General'}</span>
                    <span>Due: ${item.due_date || 'N/A'}</span>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // 3. فلترة الطلبات عبر محرك البحث
    function filterPublicDemands() {
        const query = document.getElementById('publicSearchInput').value.toLowerCase().trim();
        if (!query) {
            renderPublicBoard(publicDemands);
            return;
        }

        const filtered = publicDemands.filter(item => {
            const title = (item.title || '').toLowerCase();
            const dept = (item.department || '').toLowerCase();
            const ref = (item.ref_id || 'REQ-' + item.id).toLowerCase();
            
            return title.includes(query) || dept.includes(query) || ref.includes(query);
        });

        renderPublicBoard(filtered);
    }

    // تنسيق شكل الحالة (Status)
    function getStatusStyle(status) {
        const st = (status || '').toLowerCase();
        if (st === 'completed' || st === 'مكتمل') return 'bg-emerald-100 text-emerald-700';
        if (st === 'in_progress' || st === 'قيد التنفيذ') return 'bg-amber-100 text-amber-700';
        return 'bg-slate-100 text-slate-600';
    }

    function formatStatus(status) {
        const st = (status || '').toLowerCase();
        if (st === 'completed') return 'Completed';
        if (st === 'in_progress') return 'In Progress';
        return status || 'Pending';
    }

    // تشغيل جلب البيانات عند تحميل الصفحة
    document.addEventListener('DOMContentLoaded', loadPublicDemands);
</script>
</body>
</html>
