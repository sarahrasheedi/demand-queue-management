<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demand Queue Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                purple: '#4f008c',
                'purple-hover': '#3d006d',
                'purple-light': '#f3e8ff',
                coral: '#f84362',
                'coral-hover': '#e03250',
                dark: '#2d0050'
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style> * { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col min-h-screen">

    <!-- Header -->
    <header class="bg-brand-dark text-white border-b border-brand-purple">
        <div class="max-w-7xl mx-auto px-6 py-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">Demand Queue Lifecycle</h1>
                <p class="text-xs text-purple-200 mt-1">Real-time tracking of process automation & solution requests</p>
            </div>
            <div>
                <a href="login.html" class="text-xs font-semibold bg-brand-purple hover:bg-brand-purple-hover text-white px-4 py-2.5 rounded-lg border border-purple-400/30 transition shadow-sm">
                    Admin Portal Login
                </a>
            </div>
        </div>
    </header>

    <!-- Content Area -->
    <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow">
        
        <!-- Controls Bar -->
        <div class="flex flex-col md:flex-row justify-between items-stretch md:items-center gap-4 mb-8 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
            
            <!-- Filter Tabs -->
            <div class="flex overflow-x-auto gap-1.5 pb-2 md:pb-0 scrollbar-none" id="statusTabs">
                <button onclick="filterByStatus('ALL')" class="status-tab active-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-brand-purple text-white">All Requests</button>
                <button onclick="filterByStatus('New')" class="status-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-slate-100 text-slate-600 hover:bg-slate-200">New</button>
                <button onclick="filterByStatus('Requirement Gathering')" class="status-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-slate-100 text-slate-600 hover:bg-slate-200">Req. Gathering</button>
                <button onclick="filterByStatus('Solution Design')" class="status-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-slate-100 text-slate-600 hover:bg-slate-200">Solution Design</button>
                <button onclick="filterByStatus('Development')" class="status-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-slate-100 text-slate-600 hover:bg-slate-200">Development</button>
                <button onclick="filterByStatus('Testing')" class="status-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-slate-100 text-slate-600 hover:bg-slate-200">Testing</button>
                <button onclick="filterByStatus('Deployment')" class="status-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-slate-100 text-slate-600 hover:bg-slate-200">Deployment</button>
                <button onclick="filterByStatus('Live')" class="status-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-slate-100 text-slate-600 hover:bg-slate-200">Live</button>
            </div>

            <!-- Search Input -->
            <div class="relative w-full md:w-72">
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="🔍 Search demands..." class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-xs outline-none focus:ring-2 focus:ring-brand-purple shadow-sm">
            </div>
        </div>

        <!-- Demands Grid -->
        <div id="demandsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
            <div class="col-span-full text-center py-12 text-slate-400">Loading demand queue...</div>
        </div>
    </main>

<script>
    let allDemands = [];
    let currentFilter = 'ALL';

    // الألوان المخصصة لكل حالة
    const STATUS_STYLES = {
        'New': 'bg-blue-50 text-blue-700 border-blue-200',
        'Requirement Gathering': 'bg-amber-50 text-amber-700 border-amber-200',
        'Solution Design': 'bg-purple-50 text-purple-700 border-purple-200',
        'Development': 'bg-indigo-50 text-indigo-700 border-indigo-200',
        'Testing': 'bg-orange-50 text-orange-700 border-orange-200',
        'Deployment': 'bg-teal-50 text-teal-700 border-teal-200',
        'Live': 'bg-emerald-50 text-emerald-700 border-emerald-200'
    };

    // جلب البيانات من Supabase
    async function fetchPublicDemands() {
        const { data: demands, error } = await supabaseClient.from('demands').select('*').order('id', { ascending: false });

        if (error) {
            console.error("Error loading demands:", error);
            document.getElementById('demandsGrid').innerHTML = `<div class="col-span-full text-center py-12 text-red-500">Failed to load demands. Please refresh.</div>`;
            return;
        }

        allDemands = demands || [];
        renderCards(allDemands);
    }

    // رسم الكروت
    function renderCards(demands) {
        const grid = document.getElementById('demandsGrid');

        if (!demands || demands.length === 0) {
            grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 font-medium">No demands found in this category.</div>`;
            return;
        }

        grid.innerHTML = '';
        demands.forEach(item => {
            const formattedRefId = item.ref_id || 'REQ-' + String(item.id).padStart(3, '0');
            const statusClass = STATUS_STYLES[item.status] || 'bg-slate-50 text-slate-700 border-slate-200';
            const daysCount = item.estimated_days || 1;
            const daysLabel = daysCount === 1 ? 'Day' : 'Days';

            const card = document.createElement('div');
            card.className = "bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition p-5 flex flex-col justify-between space-y-4";
            
            card.innerHTML = `
                <div>
                    <!-- Header: Ref & Status -->
                    <div class="flex justify-between items-start mb-3 gap-2">
                        <span class="text-xs font-bold text-brand-purple tracking-wide">${formattedRefId}</span>
                        <span class="px-2.5 py-1 rounded-full text-[11px] font-bold border ${statusClass}">
                            ${item.status}
                        </span>
                    </div>

                    <!-- Title -->
                    <h3 class="font-bold text-slate-900 text-base mb-1 leading-snug">${item.title}</h3>
                    <p class="text-xs text-slate-500 font-medium mb-3">${item.department || 'General'}</p>
                </div>

                <!-- Footer Details -->
                <div class="pt-3 border-t border-slate-100 flex flex-col gap-2">
                    
                    <!-- Estimated Effort Clear Box -->
                    <div class="inline-flex items-center gap-1.5 px-2.5 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs font-semibold text-slate-700 w-fit">
                        <svg class="w-4 h-4 text-brand-purple" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <span>Estimated Effort: <strong class="text-brand-purple font-bold">${daysCount} ${daysLabel}</strong></span>
                    </div>

                    <!-- Due Date -->
                    <div class="flex justify-between items-center text-[11px] text-slate-500 mt-1">
                        <span>Calculated Due Date:</span>
                        <span class="font-bold text-slate-700">${item.due_date || 'TBD'}</span>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // تصفية حسب الحالة
    function filterByStatus(status) {
        currentFilter = status;
        
        // تحديث شكل الأزرار
        document.querySelectorAll('.status-tab').forEach(btn => {
            btn.className = "status-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-slate-100 text-slate-600 hover:bg-slate-200";
        });
        event.target.className = "status-tab active-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition bg-brand-purple text-white";

        applyFilters();
    }

    // تصفية البحث
    function handleSearch() {
        applyFilters();
    }

    function applyFilters() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();

        let filtered = allDemands;

        if (currentFilter !== 'ALL') {
            filtered = filtered.filter(item => item.status === currentFilter);
        }

        if (query !== '') {
            filtered = filtered.filter(item => {
                const ref = (item.ref_id || 'REQ-' + String(item.id).padStart(3, '0')).toLowerCase();
                const title = (item.title || '').toLowerCase();
                const dept = (item.department || '').toLowerCase();
                return ref.includes(query) || title.includes(query) || dept.includes(query);
            });
        }

        renderCards(filtered);
    }

    document.addEventListener('DOMContentLoaded', fetchPublicDemands);
</script>
</body>
</html>
