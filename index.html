<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demand Queue — Live Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                purple: '#4f008c',
                'purple-hover': '#3d006d',
                'purple-light': '#f3e8ff',
                coral: '#f84362',
                dark: '#2d0050'
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style> * { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col min-h-screen">

    <!-- Header / Navbar -->
    <nav class="bg-brand-dark text-white px-6 py-4 border-b border-brand-purple flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <span class="font-bold text-xl tracking-wide">Demand Queue</span>
            <span class="text-xs bg-brand-purple-light text-brand-purple px-2.5 py-1 rounded-full font-bold">Live Board</span>
        </div>
        <a href="admin.html" class="text-xs font-semibold bg-brand-purple hover:bg-brand-purple-hover text-white px-4 py-2 rounded-lg transition shadow-sm">
            ⚙️ Admin Portal
        </a>
    </nav>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow">
        
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
            <div>
                <h2 class="text-2xl font-bold text-slate-900">Project Demands Queue</h2>
                <p class="text-xs text-slate-500 mt-1">Real-time status cards, estimated durations, and scheduled delivery timelines</p>
            </div>
            
            <div class="flex items-center space-x-3 w-full md:w-auto">
                <input type="text" id="publicSearchInput" oninput="filterPublicDemands()" placeholder="🔍 Search title, dept, or ID..." class="w-full md:w-64 px-3.5 py-2 bg-white border border-slate-300 rounded-lg text-xs outline-none focus:ring-2 focus:ring-brand-purple shadow-sm">
                <button onclick="loadPublicDemands()" class="text-xs font-semibold bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 px-3.5 py-2 rounded-lg transition shadow-sm flex items-center shrink-0">
                    🔄 Refresh Board
                </button>
            </div>
        </div>

        <!-- Demands Grid -->
        <div id="cardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full py-12 text-center text-slate-400">
                Loading demands...
            </div>
        </div>

    </div>

<script>
    let publicDemands = [];

    // 1. Fetch data from Supabase and apply priority sorting: In Progress -> Pending -> Completed
    async function loadPublicDemands() {
        const grid = document.getElementById('cardsGrid');
        if (!grid) return;

        grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400">Loading demands...</div>`;

        const { data: demands, error } = await supabaseClient
            .from('demands')
            .select('*');

        if (error) {
            console.error("Error fetching demands for dashboard:", error);
            grid.innerHTML = `<div class="col-span-full text-center py-8 text-rose-500">Failed to load demands. Check console.</div>`;
            return;
        }

        // Status weight mapping for priority sorting
        const statusPriority = {
            'in_progress': 1,
            'قيد التنفيذ': 1,
            'pending': 2,
            'قيد الانتظار': 2,
            'completed': 3,
            'مكتمل': 3
        };

        const sortedDemands = (demands || []).sort((a, b) => {
            const priorityA = statusPriority[(a.status || '').toLowerCase()] || 4;
            const priorityB = statusPriority[(b.status || '').toLowerCase()] || 4;

            // Priority 1: Sort by Status Weight
            if (priorityA !== priorityB) {
                return priorityA - priorityB;
            }

            // Priority 2: Sort by Due Date (Earliest first)
            if (a.due_date && b.due_date) {
                return new Date(a.due_date) - new Date(b.due_date);
            }
            if (a.due_date) return -1;
            if (b.due_date) return 1;

            // Priority 3: Fallback to ID
            return b.id - a.id;
        });

        publicDemands = sortedDemands;
        renderPublicBoard(publicDemands);
    }

    // 2. Render demand cards with top duration badge and bottom requester/due-date details
    function renderPublicBoard(demands) {
        const grid = document.getElementById('cardsGrid');
        if (!grid) return;

        if (!demands || demands.length === 0) {
            grid.innerHTML = `<div class="col-span-full text-center py-8 text-slate-400">No demands available.</div>`;
            return;
        }

        grid.innerHTML = '';
        demands.forEach(item => {
            const card = document.createElement('div');
            const isProgress = (item.status || '').toLowerCase() === 'in_progress' || (item.status || '') === 'قيد التنفيذ';
            
            card.className = `bg-white rounded-2xl border ${isProgress ? 'border-2 border-amber-400 shadow-md' : 'border-slate-200 shadow-sm'} hover:shadow-md transition overflow-hidden flex flex-col justify-between`;
            
            const refCode = item.ref_id || ('REQ-' + String(item.id).padStart(3, '0'));
            const days = item.estimated_days || 1;

            card.innerHTML = `
                <!-- Section 1: Header + Title + Top Duration Badge -->
                <div class="p-5 pb-3">
                    <div class="flex justify-between items-center mb-3">
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-extrabold text-brand-purple bg-brand-purple-light px-2.5 py-1 rounded-md">${refCode}</span>
                            <span class="text-[11px] font-bold px-2.5 py-1 rounded-full ${getStatusStyle(item.status)}">
                                ${formatStatus(item.status)}
                            </span>
                        </div>
                        
                        <!-- Estimated Duration Top Badge -->
                        <div class="bg-slate-900 text-amber-300 px-3 py-1 rounded-lg text-xs font-bold flex items-center space-x-1 shadow-sm">
                            <span>⏱️ ${days} ${days > 1 ? 'Days' : 'Day'}</span>
                        </div>
                    </div>

                    <h3 class="font-bold text-slate-900 text-base leading-snug mb-1">${item.title || 'Untitled Demand'}</h3>
                </div>

                <!-- Section 2: Details Footer (Requester, Dept & Due Date) -->
                <div class="bg-slate-50 px-5 py-3 border-t border-slate-100 space-y-2.5 text-xs text-slate-600">
                    <div class="flex justify-between items-center">
                        <span class="text-slate-400 font-medium">Department:</span>
                        <span class="font-bold text-slate-800 bg-white px-2 py-0.5 rounded border border-slate-200">${item.department || 'General'}</span>
                    </div>

                    <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-200/60">
                        <div>
                            <span class="text-slate-400 block text-[10px]">Est. Duration:</span>
                            <span class="font-bold text-slate-700">${days} Business ${days > 1 ? 'Days' : 'Day'}</span>
                        </div>
                        <div class="text-right">
                            <span class="text-slate-400 block text-[10px]">Target Due Date:</span>
                            <span class="font-bold text-brand-purple">${item.due_date || 'N/A'}</span>
                        </div>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // 3. Search Filter
    function filterPublicDemands() {
        const query = document.getElementById('publicSearchInput').value.toLowerCase().trim();
        if (!query) {
            renderPublicBoard(publicDemands);
            return;
        }

        const filtered = publicDemands.filter(item => {
            const title = (item.title || '').toLowerCase();
            const dept = (item.department || '').toLowerCase();
            const ref = (item.ref_id || 'REQ-' + item.id).toLowerCase();
            
            return title.includes(query) || dept.includes(query) || ref.includes(query);
        });

        renderPublicBoard(filtered);
    }

    // Status Badge Styling
    function getStatusStyle(status) {
        const st = (status || '').toLowerCase();
        if (st === 'completed' || st === 'مكتمل') return 'bg-emerald-100 text-emerald-700';
        if (st === 'in_progress' || st === 'قيد التنفيذ') return 'bg-amber-100 text-amber-800 flex items-center space-x-1';
        return 'bg-slate-100 text-slate-600';
    }

    function formatStatus(status) {
        const st = (status || '').toLowerCase();
        if (st === 'completed' || st === 'مكتمل') return 'Completed';
        if (st === 'in_progress' || st === 'قيد التنفيذ') return '<span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse mr-1"></span> In Progress';
        return 'Pending';
    }

    document.addEventListener('DOMContentLoaded', loadPublicDemands);
</script>
</body>
</html>
