<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Demand Queue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                purple: '#4f008c',
                'purple-hover': '#3d006d',
                'purple-light': '#f3e8ff',
                coral: '#f84362',
                'coral-hover': '#e03250',
                dark: '#2d0050'
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style> * { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col min-h-screen">

    <!-- Navbar -->
    <nav class="bg-brand-dark text-white px-6 py-4 border-b border-brand-purple flex justify-between items-center">
        <span class="font-bold text-lg">Demand Queue — Admin Portal</span>
        <button onclick="logout()" class="text-xs font-semibold bg-brand-coral hover:bg-brand-coral-hover px-3.5 py-1.5 rounded-lg transition">
            Logout
        </button>
    </nav>

    <!-- Content -->
    <div class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h2 class="text-xl font-bold text-slate-900">Manage Demand Queue</h2>
                <p class="text-xs text-slate-500 mt-1">Set effort estimation, update lifecycle status, or manage assigned team members</p>
            </div>
            <div class="flex space-x-3 items-center">
                <input type="text" id="adminSearchInput" oninput="filterAdminDemands()" placeholder="🔍 Search demands..." class="w-64 px-3.5 py-2 border border-slate-300 rounded-lg text-xs outline-none focus:ring-2 focus:ring-brand-purple shadow-sm">
                
                <button onclick="openModal()" class="text-xs font-semibold bg-brand-purple hover:bg-brand-purple-hover text-white px-4 py-2 rounded-lg transition">
                    + Add New Demand
                </button>
                
                <a href="index.html" class="text-xs font-semibold text-brand-purple border border-brand-purple/20 bg-brand-purple-light px-3.5 py-2 rounded-lg transition">
                    View Public Board
                </a>
            </div>
        </div>

        <!-- Table -->
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-50 text-slate-500 text-xs uppercase border-b border-slate-200">
                        <tr>
                            <th class="py-3.5 px-5 font-semibold">Ref ID</th>
                            <th class="py-3.5 px-5 font-semibold">Demand / Task</th>
                            <th class="py-3.5 px-5 font-semibold">Process / Dept</th>
                            <th class="py-3.5 px-5 font-semibold">Est. Days</th>
                            <th class="py-3.5 px-5 font-semibold">Calculated Due Date</th>
                            <th class="py-3.5 px-5 font-semibold">Assigned Developer</th>
                            <th class="py-3.5 px-5 font-semibold">Status</th>
                            <th class="py-3.5 px-5 font-semibold text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="demandsTableBody" class="divide-y divide-slate-100 text-slate-700">
                        <tr>
                            <td colspan="8" class="py-6 text-center text-slate-400">Loading demands...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Form (إضافة طلب جديد) -->
    <div id="addModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
            <h3 class="font-bold text-lg text-slate-900">Add New Demand</h3>
            
            <form id="createDemandForm" onsubmit="handleCreateDemand(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Title</label>
                    <input type="text" id="newTitle" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-purple">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Process Name / Department</label>
                    <input type="text" id="newDept" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-purple">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Estimated Days</label>
                    <input type="number" id="newDays" value="1" min="1" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-purple">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Initial Status</label>
                    <select id="newStatus" class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-purple bg-white">
                        <option value="New">New</option>
                        <option value="Requirement Gathering">Requirement Gathering</option>
                        <option value="Solution Design">Solution Design</option>
                        <option value="Development">Development</option>
                        <option value="Testing">Testing</option>
                        <option value="Deployment">Deployment</option>
                        <option value="Live">Live</option>
                    </select>
                </div>

                <div class="flex justify-end space-x-2 pt-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs font-semibold border rounded-lg text-slate-600 hover:bg-slate-50">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-xs font-semibold bg-brand-purple hover:bg-brand-purple-hover text-white rounded-lg">Save Demand</button>
                </div>
            </form>
        </div>
    </div>

<script>
    let allDemands = [];

    // قائمة الحالات السبع المعتمدة
    const STATUS_OPTIONS = [
        "New",
        "Requirement Gathering",
        "Solution Design",
        "Development",
        "Testing",
        "Deployment",
        "Live"
    ];

    // التحقق من تسجيل الدخول
    if (localStorage.getItem('isLoggedIn') !== 'true') window.location.href = "login.html";
    
    function getCurrentUser() {
        return localStorage.getItem('userName') || localStorage.getItem('userEmail') || 'Admin';
    }

    function logout() {
        localStorage.clear();
        window.location.href = "login.html";
    }

    // Modal Controls
    function openModal() { document.getElementById('addModal').classList.remove('hidden'); document.getElementById('addModal').classList.add('flex'); }
    function closeModal() { document.getElementById('addModal').classList.add('hidden'); document.getElementById('addModal').classList.remove('flex'); }

    // حساب تاريخ الاستحقاق
    function calculateDueDate(days) {
        if (!days || days <= 0) return null;
        const date = new Date();
        date.setDate(date.getDate() + parseInt(days));
        return date.toISOString().split('T')[0];
    }

    // 1. جلب بيانات جدول الأدمن
    async function loadAdminDemands() {
        const { data: demands, error } = await supabaseClient.from('demands').select('*').order('id', { ascending: false });
        const tbody = document.getElementById('demandsTableBody');

        if (error) {
            console.error("Error fetching demands:", error);
            tbody.innerHTML = `<tr><td colspan="8" class="py-6 text-center text-red-500">Error loading data. Check console.</td></tr>`;
            return;
        }

        allDemands = demands || [];
        renderAdminTable(allDemands);
    }

    // دالة رسم الصفوف مع القائمة المنسدلة الحالات السبع
    function renderAdminTable(demands) {
        const tbody = document.getElementById('demandsTableBody');

        if (!demands || demands.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" class="py-6 text-center text-slate-400">No demands found.</td></tr>`;
            return;
        }

        tbody.innerHTML = '';
        demands.forEach(item => {
            const formattedRefId = item.ref_id || 'REQ-' + String(item.id).padStart(3, '0');
            const row = document.createElement('tr');
            row.className = "hover:bg-slate-50 transition";

            // بناء القائمة المنسدلة بالحالات السبع ديناميكياً
            let statusOptionsHtml = STATUS_OPTIONS.map(opt => 
                `<option value="${opt}" ${item.status === opt ? 'selected' : ''}>${opt}</option>`
            ).join('');

            row.innerHTML = `
                <td class="py-4 px-5 font-bold text-brand-purple">${formattedRefId}</td>
                <td class="py-4 px-5 font-semibold text-slate-900">${item.title}</td>
                <td class="py-4 px-5 text-xs text-slate-500">${item.process_name || item.department || 'General'}</td>
                <td class="py-4 px-5">
                    <input type="number" id="effort-${item.id}" value="${item.estimated_days || 1}" min="1" class="w-16 px-2 py-1 border rounded text-center text-xs font-bold">
                </td>
                <td class="py-4 px-5 font-semibold text-slate-800">${item.due_date || '-'}</td>
                <td class="py-4 px-5 text-xs font-bold text-brand-purple">
                    <span class="bg-brand-purple-light px-2 py-1 rounded">${item.assigned_to || 'Unassigned'}</span>
                </td>
                <td class="py-4 px-5">
                    <select id="status-${item.id}" class="text-xs font-semibold px-2.5 py-1.5 rounded border bg-slate-50 focus:ring-2 focus:ring-brand-purple">
                        ${statusOptionsHtml}
                    </select>
                </td>
                <td class="py-4 px-5 text-right space-x-2">
                    <button onclick="saveDemandChanges(${item.id})" class="text-xs bg-brand-purple hover:bg-brand-purple-hover text-white font-semibold px-3 py-1.5 rounded-lg">Save</button>
                    <button onclick="deleteDemand(${item.id})" class="text-xs bg-red-100 hover:bg-red-200 text-red-600 font-semibold px-3 py-1.5 rounded-lg transition">Delete</button>
                </td>
            `;
            tbody.appendChild(row);
        });
    }

    // تصفية البحث
    function filterAdminDemands() {
        const query = document.getElementById('adminSearchInput').value.toLowerCase().trim();
        
        const filtered = allDemands.filter(item => {
            const formattedRefId = (item.ref_id || 'REQ-' + String(item.id).padStart(3, '0')).toLowerCase();
            const title = (item.title || '').toLowerCase();
            const dept = (item.process_name || item.department || '').toLowerCase();
            const assigned = (item.assigned_to || '').toLowerCase();
            
            return formattedRefId.includes(query) || title.includes(query) || dept.includes(query) || assigned.includes(query);
        });

        renderAdminTable(filtered);
    }

    // 2. إضافة طلب جديد
    async function handleCreateDemand(e) {
        e.preventDefault();
        const title = document.getElementById('newTitle').value;
        const department = document.getElementById('newDept').value;
        const days = parseInt(document.getElementById('newDays').value);
        const status = document.getElementById('newStatus').value;
        const dueDate = calculateDueDate(days);
        const currentUser = getCurrentUser();

        const { data, error } = await supabaseClient.from('demands').insert([{
            title: title,
            department: department,
            process_name: department,
            estimated_days: days,
            due_date: dueDate,
            status: status,
            assigned_to: currentUser
        }]).select();

        if (error) {
            alert('Error adding demand: ' + error.message);
            console.error(error);
        } else {
            const newId = data[0].id;
            const refCode = 'REQ-' + String(newId).padStart(3, '0');
            await supabaseClient.from('demands').update({ ref_id: refCode }).eq('id', newId);
            
            closeModal();
            document.getElementById('createDemandForm').reset();
            loadAdminDemands();
        }
    }

    // 3. تعديل وتحديث الطلب
    async function saveDemandChanges(id) {
        const days = parseInt(document.getElementById(`effort-${id}`).value);
        const newStatus = document.getElementById(`status-${id}`).value;
        const dueDate = calculateDueDate(days);
        const currentUser = getCurrentUser();

        const { error } = await supabaseClient.from('demands').update({
            estimated_days: days,
            due_date: dueDate,
            status: newStatus,
            assigned_to: currentUser
        }).eq('id', id);

        if (error) {
            alert('Error updating status: ' + error.message);
            console.error("Update error:", error);
        } else {
            alert('Updated successfully!');
            loadAdminDemands();
        }
    }

    // 4. حذف الطلب
    async function deleteDemand(id) {
        if (!confirm('Are you sure you want to delete this demand?')) return;

        const { error } = await supabaseClient.from('demands').delete().eq('id', id);

        if (error) {
            alert('Error deleting demand: ' + error.message);
        } else {
            loadAdminDemands();
        }
    }

    document.addEventListener('DOMContentLoaded', loadAdminDemands);
</script>
</body>
</html>
