<!DOCTYPE html>
<html lang="en">
<head>
    <!-- 1. مكتبة سوبابايس الرسمية -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 2. ملف الإعدادات -->
    <script src="supabase-config.js"></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Demand Queue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                purple: '#4f008c',
                'purple-hover': '#3d006d',
                'purple-light': '#f3e8ff',
                coral: '#f84362',
                'coral-hover': '#e03250',
                'coral-light': '#ffeef1',
                dark: '#2d0050'
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col min-h-screen">

    <!-- Top Navigation Bar -->
    <nav class="bg-brand-dark text-white px-6 py-4 border-b border-brand-purple flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <span class="font-bold text-lg tracking-wide">Demand Queue — Admin Portal</span>
        </div>
        <div class="flex items-center space-x-4">
            <span class="text-xs text-purple-200">Logged in as: <strong class="text-white">Sarah Alrasheedi</strong></span>
            <button onclick="logout()" class="text-xs font-semibold bg-brand-coral hover:bg-brand-coral-hover text-white px-3.5 py-1.5 rounded-lg transition">
                Logout
            </button>
        </div>
    </nav>

    <!-- Main Workspace -->
    <div class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow">
        
        <!-- Header & Action -->
        <div class="flex justify-between items-center mb-6">
            <div>
                <h2 class="text-xl font-bold text-slate-900">Manage Demand Queue</h2>
                <p class="text-xs text-slate-500 mt-1">Set effort estimation and update queue status</p>
            </div>
            <a href="index.html" target="_blank" class="text-xs font-semibold text-brand-purple hover:text-brand-purple-hover border border-brand-purple/20 bg-brand-purple-light px-3.5 py-2 rounded-lg transition">
                👁️ View Public Board
            </a>
        </div>

        <!-- Management Table -->
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-50 text-slate-500 text-xs uppercase border-b border-slate-200">
                        <tr>
                            <th class="py-3.5 px-5 font-semibold">Ref ID</th>
                            <th class="py-3.5 px-5 font-semibold">Demand / Task</th>
                            <th class="py-3.5 px-5 font-semibold">Department</th>
                            <th class="py-3.5 px-5 font-semibold">Est. Days</th>
                            <th class="py-3.5 px-5 font-semibold">Calculated Due Date</th>
                            <th class="py-3.5 px-5 font-semibold">Status</th>
                            <th class="py-3.5 px-5 font-semibold text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="demandsTableBody" class="divide-y divide-slate-100 text-slate-700">
                        <tr>
                            <td colspan="7" class="py-6 text-center text-slate-400">Loading demands...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        Developed by <strong>Sarah Alrasheedi</strong> 
    </footer>

    <!-- Script للاتصال بـ Supabase والتحكم بالصفحة -->
    <script>
        // 1. حماية الصفحة
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = "login.html";
        }

        // 2. دالة تسجيل الخروج
        function logout() {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('userEmail');
            window.location.href = "login.html";
        }

        // 3. جلب الطلبات من Supabase وعرضها في الجدول
        async function loadAdminDemands() {
            const { data: demands, error } = await supabaseClient
                .from('demands')
                .select('*')
                .order('created_at', { ascending: false });

            const tbody = document.getElementById('demandsTableBody');

            if (error) {
                console.error('Error fetching demands:', error);
                tbody.innerHTML = `<tr><td colspan="7" class="py-6 text-center text-red-500">Failed to load data. Please refresh.</td></tr>`;
                return;
            }

            if (!demands || demands.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="py-6 text-center text-slate-400">No demands found.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';

            demands.forEach(item => {
                const row = document.createElement('tr');
                row.className = "hover:bg-slate-50 transition";
                row.innerHTML = `
                    <td class="py-4 px-5 font-bold text-brand-purple">${item.ref_id || 'REQ-' + item.id}</td>
                    <td class="py-4 px-5 font-semibold text-slate-900">${item.title}</td>
                    <td class="py-4 px-5 text-xs text-slate-500">${item.department || 'N/A'}</td>
                    <td class="py-4 px-5">
                        <input type="number" id="effort-${item.id}" value="${item.estimated_days || 0}" class="w-16 px-2 py-1 border border-slate-300 rounded text-center text-xs font-bold focus:ring-2 focus:ring-brand-purple outline-none">
                    </td>
                    <td class="py-4 px-5 font-semibold text-slate-800">${item.due_date || '-'}</td>
                    <td class="py-4 px-5">
                        <select id="status-${item.id}" class="text-xs font-semibold px-2.5 py-1.5 rounded border border-slate-200 bg-slate-100 text-slate-600 focus:outline-none focus:ring-2 focus:ring-brand-purple">
                            <option value="pending" ${item.status === 'pending' ? 'selected' : ''}>Pending</option>
                            <option value="in_progress" ${item.status === 'in_progress' ? 'selected' : ''}>In Progress</option>
                            <option value="completed" ${item.status === 'completed' ? 'selected' : ''}>Completed</option>
                        </select>
                    </td>
                    <td class="py-4 px-5 text-right space-x-2">
                        <button onclick="saveDemandChanges(${item.id})" class="text-xs bg-brand-purple hover:bg-brand-purple-hover text-white font-semibold px-3.5 py-1.5 rounded-lg transition">
                            Save
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // 4. دالة الحفظ
        async function saveDemandChanges(id) {
            const estimatedDays = document.getElementById(`effort-${id}`).value;
            const status = document.getElementById(`status-${id}`).value;

            const { error } = await supabaseClient
                .from('demands')
                .update({ 
                    estimated_days: parseInt(estimatedDays),
                    status: status 
                })
                .eq('id', id);

            if (error) {
                alert('حدث خطأ أثناء الحفظ: ' + error.message);
            } else {
                alert('تم حفظ التغييرات بنجاح!');
                loadAdminDemands();
            }
        }

        document.addEventListener('DOMContentLoaded', loadAdminDemands);
    </script>
</body>
</html>
